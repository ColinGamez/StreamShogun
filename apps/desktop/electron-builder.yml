appId: com.stream-shogun.app
productName: StreamShōgun
executableName: StreamShogun
copyright: Copyright © 2026 StreamShōgun
artifactName: StreamShogun-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build

icon: build/icon-1024.png

files:
  - dist/**/*
  - package.json
  # NOTE: better-sqlite3 lives in the workspace ROOT node_modules (pnpm
  # hoisting), so the bare `node_modules/better-sqlite3` glob matched nothing
  # and shipped installers without any SQLite binding. Map it explicitly per
  # platform (only the matching prebuilds, to keep installers small).
  - "!node_modules/**/*"

# Native bindings cannot load from inside app.asar — unpack them.
asarUnpack:
  - "**/*.node"

extraResources:
  - from: ../ui/dist
    to: renderer

mac:
  category: public.app-category.entertainment
  icon: build/icon-1024.png
  target:
    - dmg
    - zip
  files:
    - from: ../../node_modules/better-sqlite3
      to: node_modules/better-sqlite3
      filter:
        - package.json
        - lib/**/*
        - prebuilds/darwin-x64.node
        - prebuilds/darwin-arm64.node

win:
  icon: build/icon-1024.png
  target:
    - nsis
    - portable
  files:
    - from: ../../node_modules/better-sqlite3
      to: node_modules/better-sqlite3
      filter:
        - package.json
        - lib/**/*
        - prebuilds/win32-x64.node
        - prebuilds/win32-arm64.node

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
  # NOTE: must differ from `portable` — both targets emit `.exe` and the
  # shared base artifactName let one overwrite the other.
  artifactName: StreamShogun-${version}-${os}-${arch}-setup.${ext}

portable:
  artifactName: StreamShogun-${version}-${os}-${arch}-portable.${ext}

linux:
  icon: build/icon-1024.png
  target:
    - AppImage
    - deb
  category: Utility
  syncDesktopName: true
  maintainer: StreamShōgun Contributors <support@streamshogun.com>
  files:
    - from: ../../node_modules/better-sqlite3
      to: node_modules/better-sqlite3
      filter:
        - package.json
        - lib/**/*
        - prebuilds/linux-x64.node
        - prebuilds/linux-arm64.node
        - prebuilds/linuxmusl-x64.node
        - prebuilds/linuxmusl-arm64.node
