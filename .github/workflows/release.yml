name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          # latest*.yml + *.blockmap must ship with the installers —
          # electron-updater reads them from the GitHub Release to find
          # and delta-download updates.
          - os: windows-latest
            build-cmd: pnpm build:win
            artifact-pattern: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.blockmap
              apps/desktop/release/latest.yml
            artifact-name: windows
          - os: macos-latest
            build-cmd: pnpm build:mac
            artifact-pattern: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
              apps/desktop/release/*.blockmap
              apps/desktop/release/latest-mac-arm64.yml
            artifact-name: macos-arm64
          - os: macos-15-intel
            build-cmd: pnpm build:mac
            artifact-pattern: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
              apps/desktop/release/*.blockmap
              apps/desktop/release/latest-mac-x64.yml
            artifact-name: macos-x64
          - os: ubuntu-latest
            build-cmd: pnpm build:linux
            artifact-pattern: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
              apps/desktop/release/*.blockmap
              apps/desktop/release/latest-linux.yml
            artifact-name: linux

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download and verify official Electron distribution
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-electron-dist.cjs

      - name: Cache verified official packaging tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-builder-tools.cjs

      - name: Prepare macOS signing
        if: runner.os == 'macOS'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          MAC_APPLE_API_KEY_BASE64: ${{ secrets.MAC_APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.MAC_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.MAC_APPLE_API_ISSUER }}
          REQUIRE_MAC_SIGNING: ${{ vars.MAC_SIGNING_REQUIRED || 'false' }}
        run: node apps/desktop/scripts/prepare-mac-signing.mjs

      - name: Build
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.MAC_APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.MAC_APPLE_API_ISSUER || '' }}
          REQUIRE_MAC_SIGNING: ${{ runner.os == 'macOS' && vars.MAC_SIGNING_REQUIRED || 'false' }}
        run: ${{ matrix.build-cmd }}

      - name: Verify installers and updater metadata
        run: node scripts/verify-release-artifacts.cjs apps/desktop/release

      - name: Smoke test packaged database
        run: node scripts/run-packaged-smoke.cjs apps/desktop/release

      - name: Preserve architecture-specific Mac updater metadata
        if: runner.os == 'macOS'
        run: node -e "require('node:fs').renameSync('apps/desktop/release/latest-mac.yml', 'apps/desktop/release/latest-mac-' + process.arch + '.yml')"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-pattern }}
          if-no-files-found: error

      - name: Clean up macOS notarization key
        if: always() && runner.os == 'macOS'
        run: node apps/desktop/scripts/prepare-mac-signing.mjs --cleanup

  roku:
    name: Roku sideload package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Build and audit Roku package
        shell: pwsh
        run: |
          ./apps/roku/scripts/qa-static.ps1 -SkipAssetGeneration -ExcludePrivate

      - name: Upload Roku package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-roku
          path: apps/roku/dist/StreamShogun-roku.zip
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, roku]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Merge Intel and Apple Silicon updater metadata
        run: node scripts/merge-mac-update-info.cjs artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          draft: true
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.blockmap
            artifacts/latest.yml
            artifacts/latest-linux.yml
            artifacts/latest-mac.yml
