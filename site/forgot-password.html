<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#2b2f33" />
    <meta name="robots" content="noindex" />
    <title>Forgot Password — StreamShōgun</title>
    <meta name="description" content="Request a secure StreamShōgun password-reset link." />
    <link rel="stylesheet" href="/retro.css" />
  <style>body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;box-sizing:border-box;margin:0}
.card{max-width:440px;width:100%;background:#fff;border:1px solid #c4c9cf;border-radius:4px;padding:22px}
.eyebrow{display:inline-block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8f1d1d;border:1px solid #d8b4b4;background:#faf0f0;border-radius:3px;padding:3px 8px;margin-bottom:12px}
.card h1{font-size:24px;margin:0 0 8px}
.intro{font-size:12px;color:#555;line-height:1.6;margin:0}
form{margin-top:16px}
label{display:block;font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:.06em;color:#555;margin-bottom:6px}
input{background:#fff;border:1px solid #b5bbc2;border-radius:3px;padding:8px 10px;font-size:13px;font-family:inherit;color:#333;width:100%;box-sizing:border-box;outline:none}
input:focus{border-color:#0b5cad;box-shadow:0 0 0 2px rgba(11,92,173,.15)}
button{display:block;width:100%;margin-top:14px;padding:9px 14px;border:1px solid #5c1212;background:linear-gradient(to bottom,#b32d22,#8f1d1d);color:#fff;font-weight:bold;text-shadow:0 -1px 0 rgba(0,0,0,.35);border-radius:3px;cursor:pointer;font-family:inherit;font-size:13px}
button:hover:not(:disabled){background:linear-gradient(to bottom,#c43629,#9a211f)}
button:disabled{opacity:.6;cursor:default}
.message{display:none;padding:9px 12px;font-size:12px;border-radius:3px;margin-top:14px;line-height:1.5}
.message.visible{display:block}
.message.error{background:#fbeaea;border:1px solid #d9a0a0;color:#8f1d1d}
.message.success{background:#edf6ed;border:1px solid #aec9ae;color:#2e5c2e}
.footer-copy{margin-top:16px;text-align:center;font-size:12px;color:#555}
  </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">Password recovery</div>
      <h1>Reset your password.</h1>
      <p class="intro">
        Enter your account email and we’ll send a secure link that expires in 60 minutes.
      </p>

      <div id="error" class="message error" role="alert"></div>
      <div id="success" class="message success" role="status"></div>

      <form id="forgot-form" novalidate>
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
          placeholder="you@example.com"
        />
        <button id="submit-btn" type="submit">Send reset link</button>
      </form>

      <p class="footer-copy">
        <a href="/login">Back to login</a> · Google sign-in remains available separately.
      </p>
    </main>
    <script>
      var API_BASE = /^(localhost|127\.0\.0\.1)$/.test(window.location.hostname)
        ? window.location.origin + "/api"
        : "https://api.streamshogun.com";
      var form = document.getElementById("forgot-form");
      var submitBtn = document.getElementById("submit-btn");
      var errorEl = document.getElementById("error");
      var successEl = document.getElementById("success");

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        clearMessages();
        var email = document.getElementById("email").value.trim();
        if (!email) return showError("Enter your email address.");

        submitBtn.disabled = true;
        submitBtn.textContent = "Sending…";
        fetch(API_BASE + "/v1/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-client": "web" },
          body: JSON.stringify({ email: email }),
        })
          .then(asJson)
          .then(function (result) {
            if (!result.ok)
              return showError(result.data.message || "Could not request a reset link.");
            form.reset();
            successEl.textContent =
              result.data.message || "If an account exists, a reset link has been sent.";
            successEl.classList.add("visible");
          })
          .catch(function () {
            showError("Network error. Please try again.");
          })
          .finally(function () {
            submitBtn.disabled = false;
            submitBtn.textContent = "Send reset link";
          });
      });

      function asJson(response) {
        return response
          .json()
          .catch(function () {
            return {};
          })
          .then(function (data) {
            return { ok: response.ok, data: data };
          });
      }
      function clearMessages() {
        errorEl.textContent = "";
        successEl.textContent = "";
        errorEl.classList.remove("visible");
        successEl.classList.remove("visible");
      }
      function showError(message) {
        errorEl.textContent = message;
        errorEl.classList.add("visible");
      }
    </script>
  </body>
</html>
