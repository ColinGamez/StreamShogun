<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#7c5cfc" />
    <meta name="robots" content="noindex" />
    <title>Forgot Password — StreamShōgun</title>
    <meta name="description" content="Request a secure StreamShōgun password-reset link." />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #09090b
          radial-gradient(circle at top, rgba(124, 92, 252, 0.18), transparent 38%);
        color: #fafafa;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      .card {
        width: 100%;
        max-width: 560px;
        padding: 32px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        background: rgba(18, 18, 23, 0.96);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }
      .eyebrow {
        display: inline-block;
        margin-bottom: 18px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(124, 92, 252, 0.12);
        color: #cabdff;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin-bottom: 14px;
        font-size: clamp(2rem, 7vw, 3rem);
        line-height: 1;
        letter-spacing: -0.055em;
      }
      .intro,
      .footer-copy {
        color: #a1a1aa;
        font-size: 15px;
        line-height: 1.65;
      }
      form {
        margin-top: 24px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 650;
      }
      input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        background: #0d0d12;
        color: #fafafa;
        font: inherit;
        outline: none;
      }
      input:focus {
        border-color: #7c5cfc;
        box-shadow: 0 0 0 3px rgba(124, 92, 252, 0.18);
      }
      button {
        width: 100%;
        margin-top: 16px;
        padding: 13px 18px;
        border: 0;
        border-radius: 12px;
        background: #7c5cfc;
        color: #fff;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }
      .message {
        display: none;
        margin-top: 18px;
        padding: 13px 14px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.5;
      }
      .message.visible {
        display: block;
      }
      .error {
        border: 1px solid rgba(248, 113, 113, 0.35);
        background: rgba(127, 29, 29, 0.2);
        color: #fecaca;
      }
      .success {
        border: 1px solid rgba(74, 222, 128, 0.3);
        background: rgba(20, 83, 45, 0.2);
        color: #bbf7d0;
      }
      .footer-copy {
        margin-top: 22px;
        text-align: center;
      }
      a {
        color: #cabdff;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">Password recovery</div>
      <h1>Reset your password.</h1>
      <p class="intro">
        Enter your account email and we’ll send a secure link that expires in 60 minutes.
      </p>

      <div id="error" class="message error" role="alert"></div>
      <div id="success" class="message success" role="status"></div>

      <form id="forgot-form" novalidate>
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
          placeholder="you@example.com"
        />
        <button id="submit-btn" type="submit">Send reset link</button>
      </form>

      <p class="footer-copy">
        <a href="/login">Back to login</a> · Google sign-in remains available separately.
      </p>
    </main>
    <script>
      var API_BASE = /^(localhost|127\.0\.0\.1)$/.test(window.location.hostname)
        ? window.location.origin + "/api"
        : "https://api.streamshogun.com";
      var form = document.getElementById("forgot-form");
      var submitBtn = document.getElementById("submit-btn");
      var errorEl = document.getElementById("error");
      var successEl = document.getElementById("success");

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        clearMessages();
        var email = document.getElementById("email").value.trim();
        if (!email) return showError("Enter your email address.");

        submitBtn.disabled = true;
        submitBtn.textContent = "Sending…";
        fetch(API_BASE + "/v1/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-client": "web" },
          body: JSON.stringify({ email: email }),
        })
          .then(asJson)
          .then(function (result) {
            if (!result.ok)
              return showError(result.data.message || "Could not request a reset link.");
            form.reset();
            successEl.textContent =
              result.data.message || "If an account exists, a reset link has been sent.";
            successEl.classList.add("visible");
          })
          .catch(function () {
            showError("Network error. Please try again.");
          })
          .finally(function () {
            submitBtn.disabled = false;
            submitBtn.textContent = "Send reset link";
          });
      });

      function asJson(response) {
        return response
          .json()
          .catch(function () {
            return {};
          })
          .then(function (data) {
            return { ok: response.ok, data: data };
          });
      }
      function clearMessages() {
        errorEl.textContent = "";
        successEl.textContent = "";
        errorEl.classList.remove("visible");
        successEl.classList.remove("visible");
      }
      function showError(message) {
        errorEl.textContent = message;
        errorEl.classList.add("visible");
      }
    </script>
  </body>
</html>
