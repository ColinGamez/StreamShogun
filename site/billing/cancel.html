<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="theme-color" content="#7c5cfc" />
  <meta name="robots" content="noindex" />
  <title>Checkout Canceled - StreamShōgun</title>
  <meta name="description" content="Your StreamShōgun Pro checkout was canceled." />
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" as="style" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #09090b;
      --surface: #18181b;
      --border: rgba(255,255,255,0.08);
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --accent: #7c5cfc;
      --accent-hover: #9a7eff;
    }
    body {
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      line-height: 1.6;
    }
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      background: rgba(9,9,11,0.86);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
    }
    .nav-inner {
      max-width: 1100px; margin: 0 auto; padding: 0 24px; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand {
      color: var(--text); text-decoration: none; font-size: 18px; font-weight: 800;
      letter-spacing: 0;
    }
    .brand span { color: var(--accent); }
    .nav a:not(.brand) {
      color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600;
    }
    main {
      flex: 1;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 136px 24px 72px;
      display: flex;
      align-items: center;
    }
    .panel {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px;
    }
    .eyebrow {
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }
    h1 {
      font-size: clamp(28px, 6vw, 44px);
      line-height: 1.1;
      letter-spacing: 0;
      margin-bottom: 14px;
    }
    p { color: var(--text-muted); font-size: 16px; max-width: 560px; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; padding: 0 20px; border-radius: 10px;
      font-size: 14px; font-weight: 700; text-decoration: none;
      transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    @media (max-width: 560px) {
      main { padding-top: 112px; }
      .panel { padding: 28px 22px; border-radius: 12px; }
      .actions { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="brand" href="/">Stream<span>Shōgun</span></a>
      <a href="/#pricing">Pricing</a>
    </div>
  </nav>

  <main>
    <section class="panel" aria-labelledby="cancel-title">
      <div class="eyebrow">Checkout canceled</div>
      <h1 id="cancel-title">No charge was made.</h1>
      <p>
        Your Pro checkout was canceled before payment completed. You can return to pricing anytime
        if you want cloud sync, unlimited playlists, smart EPG matching, and the rest of Pro.
      </p>
      <div class="actions">
        <a class="btn btn-primary" href="/#pricing">Return to Pricing</a>
        <a class="btn btn-secondary" href="/">Back to StreamShōgun</a>
      </div>
    </section>
  </main>
</body>
</html>
