<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#7c5cfc" />
    <meta name="robots" content="noindex" />
    <title>Reset Password — StreamShōgun</title>
    <meta name="description" content="Choose a new StreamShōgun password." />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #09090b
          radial-gradient(circle at top right, rgba(124, 92, 252, 0.2), transparent 38%);
        color: #fafafa;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      .card {
        width: 100%;
        max-width: 560px;
        padding: 32px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        background: rgba(18, 18, 23, 0.96);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }
      .eyebrow {
        display: inline-block;
        margin-bottom: 18px;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(124, 92, 252, 0.12);
        color: #cabdff;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin-bottom: 14px;
        font-size: clamp(2rem, 7vw, 3rem);
        line-height: 1;
        letter-spacing: -0.055em;
      }
      .intro,
      .footer-copy {
        color: #a1a1aa;
        font-size: 15px;
        line-height: 1.65;
      }
      form {
        margin-top: 24px;
      }
      .field + .field {
        margin-top: 16px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 650;
      }
      input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        background: #0d0d12;
        color: #fafafa;
        font: inherit;
        outline: none;
      }
      input:focus {
        border-color: #7c5cfc;
        box-shadow: 0 0 0 3px rgba(124, 92, 252, 0.18);
      }
      button,
      .button-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        margin-top: 18px;
        padding: 13px 18px;
        border: 0;
        border-radius: 12px;
        background: #7c5cfc;
        color: #fff;
        font: inherit;
        font-weight: 750;
        text-decoration: none;
        cursor: pointer;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }
      .message {
        display: none;
        margin-top: 18px;
        padding: 13px 14px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.5;
      }
      .message.visible {
        display: block;
      }
      .error {
        border: 1px solid rgba(248, 113, 113, 0.35);
        background: rgba(127, 29, 29, 0.2);
        color: #fecaca;
      }
      .success {
        border: 1px solid rgba(74, 222, 128, 0.3);
        background: rgba(20, 83, 45, 0.2);
        color: #bbf7d0;
      }
      .footer-copy {
        margin-top: 22px;
        text-align: center;
      }
      a {
        color: #cabdff;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">Secure reset</div>
      <h1>Choose a new password.</h1>
      <p class="intro">
        Use at least 8 characters. Completing this reset signs out your other sessions.
      </p>

      <div id="error" class="message error" role="alert"></div>
      <div id="success" class="message success" role="status"></div>

      <form id="reset-form" novalidate>
        <div class="field">
          <label for="password">New password</label>
          <input
            id="password"
            name="password"
            type="password"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            required
          />
        </div>
        <div class="field">
          <label for="confirm-password">Confirm new password</label>
          <input
            id="confirm-password"
            name="confirm-password"
            type="password"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            required
          />
        </div>
        <button id="submit-btn" type="submit">Reset password</button>
      </form>

      <a id="login-link" class="button-link" href="/login" hidden>Continue to login</a>
      <p class="footer-copy">
        <a href="/forgot-password">Request another link</a> · Google sign-in is a separate option.
      </p>
    </main>
    <script>
      var API_BASE = /^(localhost|127\.0\.0\.1)$/.test(window.location.hostname)
        ? window.location.origin + "/api"
        : "https://api.streamshogun.com";
      var params = new URLSearchParams(window.location.search);
      var token = params.get("token") || "";
      var form = document.getElementById("reset-form");
      var submitBtn = document.getElementById("submit-btn");
      var errorEl = document.getElementById("error");
      var successEl = document.getElementById("success");
      var loginLink = document.getElementById("login-link");

      history.replaceState(null, "", "/reset-password");
      if (!token) {
        form.hidden = true;
        showError("This reset link is missing or invalid. Request a new one below.");
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        clearMessages();
        var password = document.getElementById("password").value;
        var confirmation = document.getElementById("confirm-password").value;
        if (password.length < 8) return showError("Password must be at least 8 characters.");
        if (password.length > 128) return showError("Password must be 128 characters or fewer.");
        if (password !== confirmation) return showError("Passwords do not match.");

        submitBtn.disabled = true;
        submitBtn.textContent = "Resetting…";
        fetch(API_BASE + "/v1/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-client": "web" },
          body: JSON.stringify({ token: token, newPassword: password }),
        })
          .then(asJson)
          .then(function (result) {
            if (!result.ok)
              return showError(result.data.message || "This reset link is invalid or expired.");
            token = "";
            form.reset();
            form.hidden = true;
            successEl.textContent = result.data.message || "Password updated. You can sign in now.";
            successEl.classList.add("visible");
            loginLink.hidden = false;
          })
          .catch(function () {
            showError("Network error. Please try again.");
          })
          .finally(function () {
            submitBtn.disabled = false;
            submitBtn.textContent = "Reset password";
          });
      });

      function asJson(response) {
        return response
          .json()
          .catch(function () {
            return {};
          })
          .then(function (data) {
            return { ok: response.ok, data: data };
          });
      }
      function clearMessages() {
        errorEl.textContent = "";
        successEl.textContent = "";
        errorEl.classList.remove("visible");
        successEl.classList.remove("visible");
      }
      function showError(message) {
        errorEl.textContent = message;
        errorEl.classList.add("visible");
      }
    </script>
  </body>
</html>
