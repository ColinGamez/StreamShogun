<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#2b2f33" />
    <meta name="robots" content="noindex" />
    <title>Reset Password — StreamShōgun</title>
    <meta name="description" content="Choose a new StreamShōgun password." />
    <link rel="stylesheet" href="/retro.css" />
  <style>body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;box-sizing:border-box;margin:0}
.card{max-width:440px;width:100%;background:#fff;border:1px solid #c4c9cf;border-radius:4px;padding:22px}
.eyebrow{display:inline-block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8f1d1d;border:1px solid #d8b4b4;background:#faf0f0;border-radius:3px;padding:3px 8px;margin-bottom:12px}
.card h1{font-size:24px;margin:0 0 8px}
.intro{font-size:12px;color:#555;line-height:1.6;margin:0}
form{margin-top:16px}
label{display:block;font-size:11px;font-weight:bold;text-transform:uppercase;letter-spacing:.06em;color:#555;margin-bottom:6px}
input{background:#fff;border:1px solid #b5bbc2;border-radius:3px;padding:8px 10px;font-size:13px;font-family:inherit;color:#333;width:100%;box-sizing:border-box;outline:none}
input:focus{border-color:#0b5cad;box-shadow:0 0 0 2px rgba(11,92,173,.15)}
button{display:block;width:100%;margin-top:14px;padding:9px 14px;border:1px solid #5c1212;background:linear-gradient(to bottom,#b32d22,#8f1d1d);color:#fff;font-weight:bold;text-shadow:0 -1px 0 rgba(0,0,0,.35);border-radius:3px;cursor:pointer;font-family:inherit;font-size:13px}
button:hover:not(:disabled){background:linear-gradient(to bottom,#c43629,#9a211f)}
button:disabled{opacity:.6;cursor:default}
.message{display:none;padding:9px 12px;font-size:12px;border-radius:3px;margin-top:14px;line-height:1.5}
.message.visible{display:block}
.message.error{background:#fbeaea;border:1px solid #d9a0a0;color:#8f1d1d}
.message.success{background:#edf6ed;border:1px solid #aec9ae;color:#2e5c2e}
.footer-copy{margin-top:16px;text-align:center;font-size:12px;color:#555}

.field{margin-bottom:14px}
.button-link{display:block;text-align:center;margin-top:12px;font-size:12px}
  </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">Secure reset</div>
      <h1>Choose a new password.</h1>
      <p class="intro">
        Use at least 8 characters. Completing this reset signs out your other sessions.
      </p>

      <div id="error" class="message error" role="alert"></div>
      <div id="success" class="message success" role="status"></div>

      <form id="reset-form" novalidate>
        <div class="field">
          <label for="password">New password</label>
          <input
            id="password"
            name="password"
            type="password"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            required
          />
        </div>
        <div class="field">
          <label for="confirm-password">Confirm new password</label>
          <input
            id="confirm-password"
            name="confirm-password"
            type="password"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            required
          />
        </div>
        <button id="submit-btn" type="submit">Reset password</button>
      </form>

      <a id="login-link" class="button-link" href="/login" hidden>Continue to login</a>
      <p class="footer-copy">
        <a href="/forgot-password">Request another link</a> · Google sign-in is a separate option.
      </p>
    </main>
    <script>
      var API_BASE = /^(localhost|127\.0\.0\.1)$/.test(window.location.hostname)
        ? window.location.origin + "/api"
        : "https://api.streamshogun.com";
      var params = new URLSearchParams(window.location.search);
      var token = params.get("token") || "";
      var form = document.getElementById("reset-form");
      var submitBtn = document.getElementById("submit-btn");
      var errorEl = document.getElementById("error");
      var successEl = document.getElementById("success");
      var loginLink = document.getElementById("login-link");

      history.replaceState(null, "", "/reset-password");
      if (!token) {
        form.hidden = true;
        showError("This reset link is missing or invalid. Request a new one below.");
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        clearMessages();
        var password = document.getElementById("password").value;
        var confirmation = document.getElementById("confirm-password").value;
        if (password.length < 8) return showError("Password must be at least 8 characters.");
        if (password.length > 128) return showError("Password must be 128 characters or fewer.");
        if (password !== confirmation) return showError("Passwords do not match.");

        submitBtn.disabled = true;
        submitBtn.textContent = "Resetting…";
        fetch(API_BASE + "/v1/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-client": "web" },
          body: JSON.stringify({ token: token, newPassword: password }),
        })
          .then(asJson)
          .then(function (result) {
            if (!result.ok)
              return showError(result.data.message || "This reset link is invalid or expired.");
            token = "";
            form.reset();
            form.hidden = true;
            successEl.textContent = result.data.message || "Password updated. You can sign in now.";
            successEl.classList.add("visible");
            loginLink.hidden = false;
          })
          .catch(function () {
            showError("Network error. Please try again.");
          })
          .finally(function () {
            submitBtn.disabled = false;
            submitBtn.textContent = "Reset password";
          });
      });

      function asJson(response) {
        return response
          .json()
          .catch(function () {
            return {};
          })
          .then(function (data) {
            return { ok: response.ok, data: data };
          });
      }
      function clearMessages() {
        errorEl.textContent = "";
        successEl.textContent = "";
        errorEl.classList.remove("visible");
        successEl.classList.remove("visible");
      }
      function showError(message) {
        errorEl.textContent = message;
        errorEl.classList.add("visible");
      }
    </script>
  </body>
</html>
