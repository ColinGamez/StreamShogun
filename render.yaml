services:
  - type: web
    name: streamshogun-api
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    domains:
      - api.streamshogun.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: LOG_LEVEL
        value: info
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        value: https://streamshogun.com
      - key: APP_PUBLIC_URL
        value: https://streamshogun.com
      - key: COOKIE_DOMAIN
        value: .streamshogun.com
      - key: SUPPORT_EMAIL
        value: colin.kenny777@gmail.com
      - key: EMAIL_FROM
        value: StreamShogun <no-reply@streamshogun.com>
      - key: STRIPE_PORTAL_RETURN_URL
        value: https://streamshogun.com/account
      - key: FOUNDING_MEMBER_CUTOFF
        value: 2026-06-01T00:00:00.000Z
