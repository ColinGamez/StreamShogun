packages:
  - apps/*
  - packages/*

# Electron requires a flat node_modules layout so its built-in module
# interception can find "electron" without pnpm's isolated .pnpm symlinks.
# (Was node-linker=hoisted in .npmrc; pnpm 11+ only reads settings here.)
nodeLinker: hoisted

# Dependency install-script approvals (pnpm 11+). better-sqlite3 and bcrypt
# ship N-API prebuilds for every platform, so their node-gyp fallback never
# needs to run — keep them false to avoid requiring C++ build tools.
allowBuilds:
  better-sqlite3: false
  bcrypt: false
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  electron: false
  esbuild: false

overrides:
  deepmerge-ts: ^8.0.0
  defu: ^6.1.5
  effect: ^3.20.0
  fast-uri@3: ^3.1.7
  fast-uri@4: ^4.1.4
  flatted: ^3.4.2
  js-yaml: ^4.3.0
  picomatch: ^2.3.2
  postcss: ^8.5.18
  tar: ^7.5.11
